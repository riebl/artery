name: Lint Check

on:
  workflow_call:

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/riebl/artery-gh-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare venv
        run: python3 -m venv venv

      - name: Install deps
        run: . venv/bin/activate && pip install -r src/artery/sionna/requirements.txt

      - name: Generate Compile Commands
        run: |
          . venv/bin/activate && python3 tools/build.py -cl \
            --generator Ninja \
            -D WITH_SIMULTE:BOOL=ON \
            -D WITH_OTS:BOOL=ON \
            -D WITH_TESTBED:BOOL=ON \
            -D WITH_TESTS:BOOL=ON \
            -D WITH_SIONNA:BOOL=ON \
            -D WITH_TRANSFUSION:BOOL=ON \
            -D CMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON && \
          cmake --build build/Debug --target artery-codegen

      - name: Build Artery codegen target
        run: cmake --build build/Debug --target artery-codegen

      - name: Run clang-tidy
        run: |
          git config --global --add safe.directory $PWD
          git diff -U0 origin/master | clang-tidy-diff.py -p1 -path .
